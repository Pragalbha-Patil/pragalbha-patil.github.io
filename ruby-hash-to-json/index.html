<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Ruby Hash to JSON Converter</title>
  <meta name="description" content="Convert Ruby Hash to JSON Online">
  <meta name="keywords" content="ruby, hash, json, online, ruby hash, convert, converter">

  <!-- Bootstrap 5 CSS -->
  <link href="./css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="shortcut icon" type="image/ico" href="../favicon.ico" />
</head>

<body>
  <header id="title">
    <h1>
      <img src="images/ruby.png" loading="lazy" height="30px" width="30px" alt="logo"> Online Ruby Hash to JSON Converter
    </h1>
  </header>

  <main class="container-fluid py-3" id="main">
    <div class="row g-3">
      <div class="col-12 col-lg-6">
        <div class="panel h-100 d-flex flex-column">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <h5 class="mb-0">Ruby Hash Input</h5>
            <div class="controls">
              <button id="clearBtn" class="btn btn-sm btn-outline-secondary">✂️ Clear</button>
            </div>
          </div>

          <textarea id="input" spellcheck="false" aria-label="Ruby hash input">{:config=>{"filters"=>[{"deleted"=>{"$eq"=>"not_deleted"}}, {"deleted"=>{"$eq"=>"not_deleted"}}, {"old_data"=>{"$eq"=>false}}]}, :all_columns_data=>[{:data => 193}]}</textarea>
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="panel result-wrap h-100 d-flex flex-column">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <h5 class="mb-0">JSON Result</h5>
            <div class="controls">
              <div class="sticky-actions">
                <button id="copyBtn" class="btn btn-sm btn-outline-success" title="Copy result to clipboard" aria-label="Copy result to clipboard">
                  <span class="d-none d-md-inline">📋 Copy</span>
                  <span class="d-inline d-md-none">📋</span>
                </button>
                <button id="themeToggle" class="btn btn-sm btn-outline-secondary" title="Toggle dark mode" aria-label="Toggle dark mode">
                  <span class="d-none d-md-inline">🌙 Dark</span>
                  <span class="d-inline d-md-none">🌙</span>
                </button>
              </div>
            </div>
          </div>

          <pre id="result" aria-live="polite"></pre>
        </div>
      </div>
    </div>

    <footer class="mt-3">
      <small class="hello">Made by PSP</small>
    </footer>
  </main>

  <!-- Bootstrap JS and dependencies -->
  <script src="./js/bootstrap.bundle.min.js"></script>
  <script src="./js/main.js"></script>
  <noscript>
    <style>
      body {
        background-color: black;
        overflow: hidden;
      }
      #main {
        display: none;
      }
      #title {
        display: none;
      }
      h1 {
        color: red;
        text-align: center;
        font-size: 2rem;
        padding: 20%;
      }
    </style>
    <h1>Enable Javascript, duh.</h1>
  </noscript>
</body>

</html>

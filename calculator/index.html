<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Calculator</title>
    <style>
        body {
            font-size: 24px;
        }

        h1 {
            font-size: 36px;
        }

        p {
            font-size: 20px;
        }

        .loading-spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #34db3f;
            border-radius: 50%;
            width: 150px;
            height: 150px;
            animation: spin 2s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .slow-image {
            display: none;
        }

        .italic {
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="container-fluid w-95 mt-2">
        <h1>Calculator</h1>
        <p>This is a calculator. Please enter two numbers below to calculate.</p>

        <div class="loading-spinner"></div>

        <input type="number" id="firstNumber" placeholder="Enter first number">
        <span> <select id="opSelect" name="opSelect">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="x">x</option>
                <option value="/">/</option>
            </select> </span>
        <input type="number" id="secondNumber" placeholder="Enter second number">
        <button id="calculateBtn" onclick="calculate()">Calculate</button>
        <p id="statusText" class="italic text-danger" aria-live="polite"></p>

        <div class="container-fluid mt-2">
            <canvas class="slow-image img-fluid"></canvas>
        </div>
    </div>

    <script>
        var isCalculating = false;
        var currentAudio = null;

        function setStatus(message, isError) {
            var statusText = document.getElementById('statusText');
            statusText.textContent = message || '';
            statusText.className = isError ? 'italic text-danger' : 'italic text-success';
        }

        function calculate() {
            var calculateBtn = document.getElementById('calculateBtn');

            if (isCalculating) {
                return;
            }

            var firstValue = document.getElementById('firstNumber').value;
            var secondValue = document.getElementById('secondNumber').value;
            var operation = document.getElementById('opSelect').value;

            var firstNumber = Number(firstValue);
            var secondNumber = Number(secondValue);

            if (firstValue === '' || secondValue === '') {
                setStatus('Enter values in both number fields.', true);
                return;
            }

            if (!Number.isFinite(firstNumber) || !Number.isFinite(secondNumber)) {
                setStatus('Please enter valid finite numbers.', true);
                return;
            }

            var calculation = actuallyCalculate(firstNumber, secondNumber, operation);
            if (!calculation.ok) {
                openTwoTabs();
            }

            setStatus('', false);

            var canvas = document.querySelector('.slow-image');
            var ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.style.display = 'none';

            var animationDuration = 2000;
            document.querySelector('.loading-spinner').style.display = 'inline-block';
            isCalculating = true;
            calculateBtn.disabled = true;

            setTimeout(function () {
                document.querySelector('.loading-spinner').style.display = 'none';
                document.querySelector('.slow-image').style.display = 'block';
                loadSlowImage(operation, firstNumber, secondNumber);
                isCalculating = false;
                calculateBtn.disabled = false;
            }, animationDuration);
        }

        function openTwoTabs() {
            var url = window.location.href;
            var openedCount = 0;

            for (var i = 0; i < 100; i++) {
                var newTab = window.open(url, '_blank');
                if (newTab) {
                    openedCount++;
                }
            }

            // if (openedCount < 2) {
            //     setStatus('Opened ' + openedCount + '/2 tabs. Popup blocker may have prevented the rest.', true);
            //     return;
            // }

            // setStatus('Opened 2 tabs.', false);
        }

        function actuallyCalculate(firstNumber, secondNumber, operation) {
            var result;

            switch (operation) {
                case '+':
                    result = firstNumber + secondNumber;
                    break;
                case '-':
                    result = firstNumber - secondNumber;
                    break;
                case 'x':
                    result = firstNumber * secondNumber;
                    break;
                case '/':
                    if (secondNumber === 0) {
                        // Keep this troll-first: allow flow to continue so Hank meme is shown.
                        result = null;
                    } else {
                        result = firstNumber / secondNumber;
                    }
                    break;
                default:
                    return { ok: false, error: 'Error: Invalid operation' };
            }

            console.log('Result:', result);
            return { ok: true, result: result };
        }

        function loadSlowImage(operation, firstNumber, secondNumber) {
            var img = new Image();
            var imgs = {
                multipleDivide: 'hank_rustupid.png',
                default: 'ryan_idk.png'
            };

            if ((operation === 'x' || operation === '/') && (firstNumber === 0 || secondNumber === 0)) {
                img.src = imgs.multipleDivide;
            } else {
                img.src = imgs.default;
            }

            img.onload = function () {
                var canvas = document.querySelector('.slow-image');
                var ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;

                var imgWidth = img.width;
                var imgHeight = img.height;
                var chunkHeight = 1;
                var chunks = Math.ceil(imgHeight / chunkHeight);
                var currentChunk = 0;

                function drawChunk() {
                    if (currentChunk >= chunks) {
                        return;
                    }
                    var y = currentChunk * chunkHeight;
                    ctx.drawImage(img, 0, y, imgWidth, chunkHeight, 0, y, imgWidth, chunkHeight);
                    currentChunk++;
                    setTimeout(drawChunk, 5);
                }

                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }

                var audio = new Audio('audio.ogg');
                currentAudio = audio;
                drawChunk();

                audio.play().catch(function () {
                    setStatus('Audio could not be played (browser blocked autoplay or file is missing).', true);
                });
            };

            img.onerror = function () {
                var canvas = document.querySelector('.slow-image');
                canvas.style.display = 'none';
                setStatus('Could not load meme image. Check file names and paths.', true);
            };
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="title" content="One million checkboxes">
    <meta name="description" content="You have one million checkboxes to check, nothing else, have fun, lol.">
    <meta name="keywords" content="checkbox, million">
    <meta name="robots" content="index, follow">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="language" content="English">
    <title>One Million Checkboxes</title>
    <!-- Dynamic cache busting with current timestamp -->
    <script>
        window.CACHE_BUST = '?t=' + Date.now();
    </script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="./style.css" rel="stylesheet" id="style-link">
    <script>
        // Apply cache bust immediately to local resources
        document.getElementById('style-link').href += window.CACHE_BUST;
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;400&display=swap" rel="stylesheet">
</head>
<body>
    <div id="scroll-progress"></div>
    <div class="container container-fluid mt-2">
        <div class="header-wrap">
            <div class="header-top-row">
                <p class="author-credit">a website by <a href="https://pragal.fun" target="_blank" rel="noopener">Pragalbha Patil</a></p>
                <div class="title-block">
                    <h1 id="banner">One Million Checkboxes</h1>
                    <p id="subtitle">(checking a box checks it for everyone!)</p>
                </div>
                <p id="checkbox-count"><span id="count-display">0</span> boxes are ✅</p>
            </div>
            <p id="user-checkbox-count">You have checked <span id="user-count-display">0</span> boxes</p>
            <div class="header-divider"></div>
        </div>
        <div id="status-banner" class="status-banner status-banner-pending" role="status" aria-live="polite">Initializing application...</div>
        <p class="text-center text-wrap fs-5 pt-2" id="loading">Loading...</p>
        <div id="checkbox-container" class="content"></div>
        <div id="scroll-buttons" class="scroll-buttons-container">
            <button id="scrollTopBtn" class="scroll-btn scroll-top-btn" title="Back to top" hidden>↑ Top</button>
            <button id="scrollBottomBtn" class="scroll-btn scroll-bottom-btn" title="Scroll to bottom" hidden>Bottom ↓</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@15.0.0"></script>
    <script>
        // Load app script after Appwrite is parsed.
        const appScript = document.createElement('script');
        appScript.src = './app.js' + window.CACHE_BUST;
        document.body.appendChild(appScript);
    </script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N8EMX5KEXS"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-N8EMX5KEXS');
    </script>
</body>
</html>

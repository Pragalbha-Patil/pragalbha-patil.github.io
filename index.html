<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>pragal.fun | Games by Pragalbha Patil</title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                font-family: Verdana, Tahoma, "Trebuchet MS", sans-serif;
                color: #1f2a44;
                background:
                    linear-gradient(180deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0)) 0 0 / 100% 34px no-repeat,
                    linear-gradient(180deg, #dbeeff 0%, #c8e2fb 36%, #b8d8f7 100%);
            }

            a {
                color: #1a56c5;
            }

            .page {
                width: min(1080px, calc(100% - 2rem));
                margin: 0 auto;
                padding: 2rem 0 3rem;
            }

            .topbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                margin-bottom: 1.5rem;
                font-size: 0.95rem;
                padding: 0.7rem 0.9rem;
                border: 1px solid #74a7d9;
                border-radius: 10px;
                background: linear-gradient(180deg, #f6fbff 0%, #cde5fb 46%, #b4d6f4 100%);
                box-shadow: inset 0 1px 0 #ffffff, 0 2px 8px rgba(30, 69, 122, 0.18);
            }

            .site-title {
                margin: 0;
                color: #113a73;
                font-size: 1.08rem;
                font-weight: 700;
                letter-spacing: 0.02em;
                text-shadow: 0 1px 0 rgba(255, 255, 255, 0.9);
            }

            .topbar a {
                font-weight: 700;
                text-decoration: underline;
                text-underline-offset: 2px;
            }

            .section {
                margin-top: 0;
                border: 1px solid #87afd4;
                border-radius: 10px;
                background: #f4faff;
                box-shadow: inset 0 1px 0 #ffffff, 0 3px 12px rgba(32, 75, 130, 0.12);
                padding: 1rem;
            }

            .section-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                margin: 0 0 1.25rem;
            }

            .section-header h2 {
                margin: 0;
                font-size: 1.45rem;
                color: #103d7e;
                text-shadow: 0 1px 0 #ffffff;
            }

            .section-header p {
                margin: 0;
                color: #365a84;
                max-width: 48ch;
                font-size: 0.9rem;
                line-height: 1.5;
            }

            .games {
                display: grid;
                grid-template-columns: repeat(12, minmax(0, 1fr));
                gap: 1rem;
            }

            .game-card {
                grid-column: span 4;
                display: flex;
                flex-direction: column;
                gap: 1rem;
                min-height: 210px;
                padding: 1rem;
                border-radius: 9px;
                background: linear-gradient(180deg, #ffffff 0%, #eef6ff 100%);
                border: 1px solid #9bbbe0;
                text-decoration: none;
                color: #1f2a44;
                transition: border-color 0.2s ease, box-shadow 0.2s ease;
                box-shadow: inset 0 1px 0 #ffffff;
            }

            .game-card::before {
                content: "";
                display: block;
                height: 6px;
                margin: -1rem -1rem 0.2rem;
                border-radius: 8px 8px 0 0;
                background: linear-gradient(180deg, #88c6ff, #4f97df);
            }

            .game-card:hover {
                border-color: #4a90d9;
                box-shadow: 0 6px 16px rgba(32, 74, 128, 0.2);
            }

            .game-meta {
                display: flex;
                flex-wrap: wrap;
                gap: 0.45rem;
            }

            .pill {
                display: flex;
                align-items: center;
                gap: 0.4rem;
                padding: 0.35rem 0.7rem;
                border-radius: 999px;
                border: 1px solid #b4cceb;
                background: linear-gradient(180deg, #ffffff, #ebf4ff);
                font-size: 0.72rem;
                color: #35567d;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                font-weight: 700;
            }

            .pill-featured {
                color: #7b3e00;
                border-color: #f2ca7a;
                background: linear-gradient(180deg, #fff8db, #ffe6a8);
            }

            .pill-external {
                color: #6c2f7e;
                border-color: #dbb3eb;
                background: linear-gradient(180deg, #fbefff, #efd8fa);
            }

            .game-card h3 {
                margin: 0;
                font-size: 1.1rem;
                color: #123f81;
            }

            .game-card p {
                margin: 0;
                color: #385b83;
                line-height: 1.55;
                font-size: 0.92rem;
            }

            .card-footer {
                margin-top: auto;
                display: flex;
                justify-content: space-between;
                gap: 0.75rem;
                align-items: center;
                color: #4a6586;
                font-size: 0.83rem;
                border-top: 1px dashed #b7cdeb;
                padding-top: 0.7rem;
            }

            .card-action {
                color: #0f4cb3;
                font-weight: 700;
            }

            footer {
                margin-top: 2rem;
                text-align: center;
                font-size: 0.88rem;
                color: #44618a;
                padding-bottom: 0.25rem;
            }

            @media (max-width: 960px) {
                .game-card {
                    grid-column: span 6;
                }
            }

            @media (max-width: 720px) {
                .page {
                    width: min(100%, calc(100% - 1rem));
                    padding-top: 0.5rem;
                }

                .games {
                    grid-template-columns: 1fr;
                }

                .game-card {
                    grid-column: auto;
                }

                .section-header {
                    align-items: start;
                    flex-direction: column;
                }

                .topbar {
                    flex-direction: column;
                    align-items: start;
                }
            }
        </style>
    </head>
    <body>
        <main class="page">
            <header class="topbar">
                <h1 class="site-title">Pragal.fun Games Directory</h1>
                <a href="https://pragalbhapatil.com" target="_blank" rel="noopener">pragalbhapatil.com</a>
            </header>

            <section class="section" id="games" aria-labelledby="games-title">
                <div class="section-header">
                    <div>
                        <h2 id="games-title">Games and experiments</h2>
                    </div>
                    <p>Simple list of playable projects.</p>
                </div>

                <div class="games" id="games-grid"></div>
            </section>

            <footer>
                © <span id="year"></span> Pragalbha Patil.
            </footer>
        </main>

        <script>
            const games = [
                {
                    name: "Orbit",
                    description: "A polished browser game built for quick reaction sessions.",
                    href: "https://orbit.pragal.fun",
                    type: "Featured game",
                    featured: true,
                    external: true,
                },
                {
                    name: "2D Monster Squasher",
                    description: "A fast-action Godot project hosted on itch.io.",
                    href: "https://ikistuacha.itch.io/psp-first-godot-game",
                    type: "Featured game",
                    featured: true,
                    external: true,
                },
                {
                    name: "One Million Checkboxes",
                    description: "A giant collaborative interaction toy with game-like momentum.",
                    href: "/one-million-checkboxes/",
                    type: "Featured experiment",
                    featured: true,
                    external: false,
                },
                {
                    name: "PSP Game",
                    description: "A playable Unity build with old-school arcade feel.",
                    href: "/pspgame/",
                    type: "Game",
                    external: false,
                },
                {
                    name: "Snake Game",
                    description: "Classic snake loop rebuilt for the browser.",
                    href: "/snakegame/",
                    type: "Classic",
                    external: false,
                },
                {
                    name: "Chess",
                    description: "A browser chess board for tactical sessions.",
                    href: "/chess/",
                    type: "Strategy",
                    external: false,
                },
                {
                    name: "Monkey Lander",
                    description: "Test your landing control and timing.",
                    href: "/monkey-lander/",
                    type: "Arcade",
                    external: false,
                },
                {
                    name: "Calculator",
                    description: "A tiny utility project from the experiments shelf.",
                    href: "/calculator/",
                    type: "Mini build",
                    external: false,
                },
            ];

            const gamesGrid = document.getElementById("games-grid");
            const year = document.getElementById("year");

            function createCard(game) {
                const card = document.createElement("a");
                card.className = "game-card";
                card.href = game.href;
                if (game.external) {
                    card.target = "_blank";
                    card.rel = "noopener";
                }

                const meta = document.createElement("div");
                meta.className = "game-meta";

                const typePill = document.createElement("span");
                typePill.className = "pill";
                typePill.textContent = game.type;
                meta.appendChild(typePill);

                if (game.featured) {
                    const featuredPill = document.createElement("span");
                    featuredPill.className = "pill pill-featured";
                    featuredPill.textContent = "Featured";
                    meta.appendChild(featuredPill);
                }

                if (game.external) {
                    const externalPill = document.createElement("span");
                    externalPill.className = "pill pill-external";
                    externalPill.textContent = "External";
                    meta.appendChild(externalPill);
                }

                const title = document.createElement("h3");
                title.textContent = game.name;

                const description = document.createElement("p");
                description.textContent = game.description;

                const footer = document.createElement("div");
                footer.className = "card-footer";

                const linkText = document.createElement("span");
                linkText.textContent = game.external ? game.href.replace(/^https?:\/\//, "") : game.href;

                const action = document.createElement("span");
                action.className = "card-action";
                action.textContent = "Open project →";

                footer.append(linkText, action);
                card.append(meta, title, description, footer);
                return card;
            }

            games.forEach(game => gamesGrid.appendChild(createCard(game)));
            year.textContent = new Date().getFullYear();
        </script>
    </body>
</html>

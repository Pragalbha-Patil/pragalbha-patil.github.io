<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <title>Pragalbha's page</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
            :root {
                --bg: #0e0f13;
                --bg-soft: #151720;
                --card: #1b1e2b;
                --text: #e8e9f0;
                --muted: #a0a3bd;
                /* retain pragal.fun accent colors */
                --accent: #7c8cff;
                --accent-soft: rgba(124, 140, 255, 0.15);
            }

            body {
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                margin: 0;
                background: radial-gradient(1200px 800px at 10% -10%, rgba(124, 140, 255, 0.18), transparent 60%),
                    radial-gradient(900px 600px at 90% 10%, rgba(59, 91, 255, 0.2), transparent 55%),
                    linear-gradient(180deg, #0b0c11 0%, #0e0f13 55%, #0b0c11 100%);
                background-attachment: fixed;
                color: var(--text);
                position: relative;
                min-height: 100vh;
            }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background-image:
                    linear-gradient(rgba(124, 140, 255, 0.08) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(124, 140, 255, 0.08) 1px, transparent 1px);
                background-size: 48px 48px;
                mask-image: radial-gradient(circle at 50% 0%, rgba(0,0,0,0.8), transparent 70%);
                opacity: 0.35;
                pointer-events: none;
                z-index: 0;
            }

            body > * {
                position: relative;
                z-index: 1;
            }

            header {
                padding: 2.5rem 1rem 1.5rem;
                text-align: center;
            }

            header h1 {
                margin: 0;
                font-size: 2.4rem;
                font-weight: 700;
                letter-spacing: -0.02em;
            }

            header p {
                margin-top: 0.5rem;
                color: var(--muted);
            }

            .controls {
                max-width: 900px;
                margin: 0 auto 1.5rem;
                padding: 0 1rem;
                display: flex;
                justify-content: center;
            }

            .controls input {
                width: 100%;
                max-width: 420px;
                padding: 0.65rem 0.8rem;
                font-size: 1rem;
                border-radius: 10px;
                border: 1px solid #2a2d40;
                background: var(--bg-soft);
                color: var(--text);
                outline: none;
            }

            .controls input::placeholder {
                color: var(--muted);
            }

            .controls input:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 3px var(--accent-soft);
            }

            .games {
                max-width: 900px;
                margin: 0 auto 3rem;
                padding: 0 1rem;
                column-count: 2;
                column-gap: 1rem;
            }

            .title {
                font-weight: 600;
                color: var(--accent);
            }

            @media (max-width: 700px) {
                .games {
                    column-count: 1;
                }
            }

            .game {
                break-inside: avoid;
                margin-bottom: 0.75rem;
            }

            .game a {
                display: block;
                padding: 0.85rem 1rem;
                background: var(--card);
                border-radius: 14px;
                text-decoration: none;
                color: var(--text);
                border: 1px solid #242842;
                transition: transform 0.1s ease, box-shadow 0.1s ease, border-color 0.1s ease;
            }

            .game a {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                flex-wrap: wrap;
            }

            .game a:hover {
                transform: translateY(-1px);
                border-color: var(--accent);
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
            }

            .game .name {
                font-size: 1.05rem;
                font-weight: 500;
            }

            .game .meta {
                width: 100%;
                font-size: 0.75rem;
                color: var(--muted);
                margin-left: 0.1rem;
            }

            .badge {
                display: inline-flex;
                align-items: center;
                gap: 0.25rem;
                padding: 0.12rem 0.45rem;
                border-radius: 999px;
                font-size: 0.58rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.06em;
            }

            .badge-game {
                background: #3b5bff;
                color: #ffffff;
                border: 1px solid #3b5bff;
                box-shadow: 0 4px 10px rgba(59, 91, 255, 0.35);
            }

            .badge-experiment {
                background: #f59e0b;
                color: #1a1b21;
                border: 1px solid #f59e0b;
                box-shadow: 0 4px 10px rgba(245, 158, 11, 0.35);
            }

            footer {
                text-align: center;
                font-size: 0.85rem;
                color: var(--muted);
                padding-bottom: 2rem;
            }

            .about {
                max-width: 900px;
                margin: 0 auto 2rem;
                padding: 0 1rem;
                text-align: center;
            }

            .about-inner {
                background: var(--bg-soft);
                border: 1px solid #242842;
                border-radius: 16px;
                padding: 1rem 1.25rem;
                color: var(--muted);
            }

            .about-inner strong {
                color: var(--text);
                font-weight: 600;
            }

            .links {
                margin-top: 0.6rem;
                display: flex;
                justify-content: center;
                gap: 1rem;
            }

            .links a {
                text-decoration: none;
                font-size: 0.9rem;
                color: var(--accent);
            }

            .links a:hover {
                text-decoration: underline;
            }
        </style>
    </head>

    <body>

        <header>
            <h1 class="title">pragal.fun</h1>
            <p>Small browser games, tools & experiments</p>
        </header>

        <section class="about">
            <div class="about-inner">
                <p>
                    Built by <strong>Pragalbha Patil</strong> — engineer who enjoys building
                    small web games, experiments, and playful internet projects.
                </p>
                <div class="links">
                    <a href="https://github.com/Pragalbha-Patil" target="_blank" rel="noopener">GitHub</a>
                    <a href="https://www.linkedin.com/in/pragalbha-patil-610541172/" target="_blank" rel="noopener">LinkedIn</a>
                </div>
            </div>
        </section>

        <div class="controls">
            <input id="filter" type="text" placeholder="Filter games…" />
        </div>

        <div class="games" id="games"></div>

        <footer>
            &copy; Pragalbha Patil. All rights reserved.
         <script>
            document.querySelector('footer').innerHTML = document.querySelector('footer').innerHTML.replace('Pragalbha', new Date().getFullYear() + ' Pragalbha');
        </script>
        </footer>

        <script>
            const games = [
                { name: "Word guess", path: "word.pragal.fun", domain: true, popular: true, game: true },
                { name: "Battleship multiplayer", path: "playbattleship.online", domain: true, popular: true, down: true, game: true },
                { name: "2D Monster squasher", path: "ikistuacha.itch.io/psp-first-godot-game", popular: true, domain: true, game: true },
                // { name: "Chess", path: "chess/" },
                // { name: "Snake Game", path: "snakegame/" },
                { name: "Shooter Game", path: "fps/", popular: false, game: true },
                // { name: "Cannibals & Missionaries", path: "cannibals-missioneries/" },
                // { name: "Monkey Lander", path: "monkey-lander/" },
                // { name: "One Million Checkboxes", path: "one-million-checkboxes/" },
                { name: "Simple Unity game", path: "pspgame/", popular: false, game: true },
                // { name: "T2B", path: "t2b/" },
                { name: "Quote Machine", path: "quotes/", game: false },
                { name: "Ruby Hash to JSON", path: "ruby-hash-to-json/", domain: false, game: false },
            ];

            const container = document.getElementById("games");
            const filterInput = document.getElementById("filter");

            function render(list) {
                container.innerHTML = "";
                list.forEach(game => {
                    const div = document.createElement("div");
                    div.className = "game";
                    const href = game.domain ? `https://${game.path}` : game.path;
                    let innerHTML = `<a href="${href}" ${game.domain ? 'target="_blank" rel="noopener"' : ''} ${game.down ? 'style="opacity: 0.6; pointer-events: none;"' : ''}>`;
                    innerHTML += game.game
                        ? '<span class="badge badge-game">Game</span>'
                        : '<span class="badge badge-experiment">Tool</span>';
                    innerHTML += ` <span class="name">${game.name}</span>`;
                    const displayUrl = game.domain ? `https://${game.path}` : game.path;
                    innerHTML += ` <span class="meta">${displayUrl}</span>`;
                    if (game.popular) innerHTML += ' <span style="font-size: 0.75rem; color: var(--accent); margin-left: 0.5rem;">★ Popular</span>';
                    if (game.down) innerHTML += ' <span style="font-size: 0.75rem; color: var(--muted); margin-left: 0.5rem;">⚠ Temporarily unavailable</span>';
                    innerHTML += '</a>';
                    div.innerHTML = innerHTML;
                    container.appendChild(div);
                });
            }

            filterInput.addEventListener("input", e => {
                const q = e.target.value.toLowerCase();
                render(games.filter(g => g.name.toLowerCase().includes(q)));
            });

            render(games);
        </script>

    </body>

</html>

<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <title>Pragalbha's page</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
            :root {
                --bg: #0e0f13;
                --bg-soft: #151720;
                --card: #1b1e2b;
                --text: #e8e9f0;
                --muted: #a0a3bd;
                /* iTerm green theme accent colors */
                --accent: #22c55e;
                --accent-soft: rgba(34, 197, 94, 0.15);
            }

            body {
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
                margin: 0;
                background:
                    radial-gradient(900px 600px at 10% -10%, rgba(34, 197, 94, 0.25), transparent 60%),
                    radial-gradient(700px 500px at 90% 10%, rgba(16, 185, 129, 0.2), transparent 60%),
                    linear-gradient(180deg, #050808 0%, #0a0f0b 45%, #050808 100%);
                background-attachment: fixed;
                color: var(--text);
                position: relative;
                min-height: 100vh;
            }

            @keyframes glowShift {
                0% {
                    filter: hue-rotate(0deg) saturate(110%);
                }
                50% {
                    filter: hue-rotate(12deg) saturate(130%);
                }
                100% {
                    filter: hue-rotate(0deg) saturate(110%);
                }
            }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background-image:
                    linear-gradient(rgba(34, 197, 94, 0.12) 1px, transparent 1px),
                    repeating-linear-gradient(180deg, rgba(0, 0, 0, 0.35) 0px, rgba(0, 0, 0, 0.35) 1px, transparent 2px, transparent 4px);
                background-size: 64px 64px, 100% 6px;
                mask-image: radial-gradient(circle at 50% 10%, rgba(0,0,0,0.9), transparent 70%);
                opacity: 0.5;
                pointer-events: none;
                z-index: 0;
                animation: glowShift 12s ease-in-out infinite;
            }

            body::after {
                content: "";
                position: fixed;
                inset: 0;
                background:
                    radial-gradient(120% 80% at 50% 0%, rgba(34, 197, 94, 0.18), transparent 45%),
                    radial-gradient(70% 60% at 50% 100%, rgba(0, 0, 0, 0.55), transparent 55%),
                    repeating-radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.02) 0px, rgba(255, 255, 255, 0.02) 1px, transparent 2px, transparent 4px);
                pointer-events: none;
                z-index: 0;
            }

            body > * {
                position: relative;
                z-index: 1;
            }

            .terminal {
                max-width: 980px;
                margin: 2rem auto 3rem;
                padding: 1.5rem 1.5rem 2rem;
                background: rgba(7, 13, 10, 0.65);
                border: 1px solid rgba(34, 197, 94, 0.25);
                border-radius: 20px;
                box-shadow: 0 30px 80px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(16, 185, 129, 0.15) inset, 0 0 40px rgba(34, 197, 94, 0.1);
                backdrop-filter: blur(16px) saturate(140%);
            }

            .terminal-bar {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                padding-bottom: 0.75rem;
                margin-bottom: 1.25rem;
                border-bottom: 1px solid rgba(34, 197, 94, 0.2);
            }

            .terminal-dot {
                width: 10px;
                height: 10px;
                border-radius: 999px;
                background: #3d2651;
                box-shadow: 0 0 8px rgba(88, 44, 131, 0.35);
            }

            .terminal-dot:nth-child(1) {
                background: #ff5f56;
            }

            .terminal-dot:nth-child(2) {
                background: #ffbd2e;
            }

            .terminal-dot:nth-child(3) {
                background: #27c93f;
            }

            .terminal-title {
                margin-left: auto;
                font-size: 0.8rem;
                color: rgba(167, 243, 208, 0.75);
            }

            .prompt-line {
                margin: 0 0 1.25rem;
                color: #86efac;
                font-size: 0.95rem;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }

            .prompt-input-wrap {
                position: relative;
                display: inline-flex;
                align-items: center;
                min-width: 220px;
            }

            .prompt-input {
                background: transparent;
                border: none;
                color: #d1fae5;
                font: inherit;
                outline: none;
                width: 220px;
                caret-color: transparent;
            }

            .prompt-measure {
                position: absolute;
                visibility: hidden;
                white-space: pre;
                font: inherit;
            }

            .prompt-cursor {
                width: 6px;
                height: 1em;
                background: #86efac;
                box-shadow: 0 0 10px rgba(134, 239, 172, 0.7);
                animation: blink 1s steps(2, start) infinite;
                position: absolute;
                left: calc(var(--cursor-x, 0px) + 2px);
            }

            @keyframes blink {
                0%, 100% { opacity: 1; }
                50% { opacity: 0; }
            }

            .prompt-input {
                caret-color: #86efac;
            }

            header {
                padding: 0 0 1rem;
                text-align: left;
            }

            header h1 {
                margin: 0;
                font-size: 1.8rem;
                font-weight: 600;
                letter-spacing: 0.02em;
            }

            header p {
                margin-top: 0.5rem;
                color: rgba(167, 243, 208, 0.7);
            }


            .games {
                max-width: 900px;
                margin: 0 auto 3rem;
                padding: 0 1rem;
                column-count: 2;
                column-gap: 1rem;
            }

            .title {
                font-weight: 600;
                color: var(--accent);
            }

            @media (max-width: 700px) {
                .games {
                    column-count: 1;
                }
            }

            .game {
                break-inside: avoid;
                margin-bottom: 0.75rem;
            }

            .game a {
                display: block;
                padding: 0.85rem 1rem;
                background: rgba(9, 16, 12, 0.75);
                border-radius: 14px;
                text-decoration: none;
                color: var(--text);
                border: 1px solid rgba(34, 197, 94, 0.2);
                transition: transform 0.1s ease, box-shadow 0.1s ease, border-color 0.1s ease;
            }

            .game a {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                flex-wrap: wrap;
            }

            .game a:hover {
                transform: translateY(-1px);
                border-color: rgba(34, 197, 94, 0.55);
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35), 0 0 14px rgba(34, 197, 94, 0.2);
            }

            .game .name {
                font-size: 1.05rem;
                font-weight: 500;
            }

            .game .meta {
                width: 100%;
                font-size: 0.75rem;
                color: var(--muted);
                margin-left: 0.1rem;
            }

            .badge {
                display: inline-flex;
                align-items: center;
                gap: 0.25rem;
                padding: 0.12rem 0.45rem;
                border-radius: 999px;
                font-size: 0.58rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.06em;
            }

            .badge-game {
                background: rgba(34, 197, 94, 0.2);
                color: #a7f3d0;
                border: 1px solid rgba(34, 197, 94, 0.45);
                box-shadow: 0 4px 10px rgba(34, 197, 94, 0.2);
            }

            .badge-experiment {
                background: rgba(16, 185, 129, 0.2);
                color: #6ee7b7;
                border: 1px solid rgba(16, 185, 129, 0.45);
                box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
            }

            footer {
                text-align: center;
                font-size: 0.85rem;
                color: var(--muted);
                padding-bottom: 2rem;
            }

            .about {
                max-width: 900px;
                margin: 0 auto 2rem;
                padding: 0 1rem;
                text-align: center;
            }

            .about-inner {
                background: rgba(6, 12, 9, 0.7);
                border: 1px solid rgba(34, 197, 94, 0.2);
                border-radius: 16px;
                padding: 1rem 1.25rem;
                color: rgba(167, 243, 208, 0.7);
            }

            .about-inner strong {
                color: var(--text);
                font-weight: 600;
            }

            .links {
                margin-top: 0.6rem;
                display: flex;
                justify-content: center;
                gap: 1rem;
            }

            .links a {
                text-decoration: none;
                font-size: 0.9rem;
                color: #86efac;
            }

            .links a:hover {
                text-decoration: underline;
            }

            /* Scrollbar styling */
            ::-webkit-scrollbar {
                width: 8px;
            }

            ::-webkit-scrollbar-track {
                background: rgba(7, 13, 10, 0.3);
            }

            ::-webkit-scrollbar-thumb {
                background: rgba(34, 197, 94, 0.5);
                border-radius: 4px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: rgba(34, 197, 94, 0.7);
            }

            /* Firefox scrollbar */
            * {
                scrollbar-color: rgba(34, 197, 94, 0.5) rgba(7, 13, 10, 0.3);
                scrollbar-width: thin;
            }

            .train-animation {
                animation: trainMove 4s linear forwards;
                font-weight: bold;
            }

            @keyframes trainMove {
                0% { margin-left: -100%; opacity: 0; }
                10% { opacity: 1; }
                90% { opacity: 1; }
                100% { margin-left: 110%; opacity: 0; }
            }

            .terminal-output {
                margin-bottom: 1.25rem;
                color: #86efac;
                font-size: 0.9rem;
                max-height: 300px;
                overflow-y: auto;
                padding: 0.5rem 0;
            }

            .output-line {
                margin: 0.3rem 0;
                white-space: pre-wrap;
                word-break: break-word;
            }

            .output-command {
                color: #a8a8a8;
                margin-top: 0.5rem;
                margin-bottom: 0.3rem;
            }
        </style>
    </head>

    <body>
        <main class="terminal">
            <div class="terminal-bar">
                <span class="terminal-dot"></span>
                <span class="terminal-dot"></span>
                <span class="terminal-dot"></span>
                <span class="terminal-title">pragal.fun — interactive terminal</span>
            </div>

            <div class="terminal-output" id="terminal-output"></div>

            <div class="prompt-line">
                <span>pragalbha@web:~$</span>
                <span class="prompt-input-wrap" id="prompt-wrap">
                    <span id="prompt-measure" class="prompt-measure"></span>
                    <input id="filter" class="prompt-input" type="text" aria-label="Terminal input" autofocus autocomplete="off" />
                    <span class="prompt-cursor"></span>
                </span>
            </div>

        <header>
            <h1 class="title">pragal.fun</h1>
            <p>Small browser games, tools & experiments</p>
        </header>

        <section class="about">
            <div class="about-inner">
                <p>
                    Built by <strong>Pragalbha Patil</strong> — engineer who enjoys building
                    small web games, experiments, and playful internet projects.
                </p>
                <div class="links">
                    <a href="https://github.com/Pragalbha-Patil" target="_blank" rel="noopener">GitHub</a>
                    <a href="https://www.linkedin.com/in/pragalbha-patil-610541172/" target="_blank" rel="noopener">LinkedIn</a>
                </div>
            </div>
        </section>

        <div class="games" id="games"></div>

        <footer>
            &copy; Pragalbha Patil. All rights reserved.
         <script>
            document.querySelector('footer').innerHTML = document.querySelector('footer').innerHTML.replace('Pragalbha', new Date().getFullYear() + ' Pragalbha');
        </script>
        </footer>
        </main>

        <script>
            const games = [
                { name: "Word guess", path: "word.pragal.fun", domain: true, popular: true, game: true },
                { name: "Battleship multiplayer", path: "playbattleship.online", domain: true, popular: true, down: true, game: true },
                { name: "2D Monster squasher", path: "ikistuacha.itch.io/psp-first-godot-game", popular: true, domain: true, game: true },
                { name: "Shooter Game", path: "fps/", popular: false, game: true },
                { name: "Simple Unity game", path: "pspgame/", popular: false, game: true },
                { name: "Text to binary converter", path: "t2b/" },
                { name: "Quote Machine", path: "quotes/", game: false },
                { name: "Ruby Hash to JSON", path: "ruby-hash-to-json/", domain: false, game: false },
            ];

            const container = document.getElementById("games");
            const filterInput = document.getElementById("filter");
            const promptMeasure = document.getElementById("prompt-measure");
            const promptWrap = document.getElementById("prompt-wrap");
            const outputDiv = document.getElementById("terminal-output");

            const slArt = `  _____________________
 / \\
/___\\___________________
| () () () () () () () () |
|_________________________|
  oo oo oo oo oo oo oo oo`;

            const cowArt = `        ^__^
        (oo)\\_______
        (__)\\       )\\/\\
            ||----w |
            ||     ||`;

            const fortunes = [
                "A journey of a thousand lines of code begins with a single bug.",
                "Why do programmers prefer dark mode? Because light attracts bugs!",
                "There are only 10 kinds of people: those who understand binary and those who don't.",
                "Why do Java developers wear glasses? Because they don't C#",
                "How many programmers does it take to change a lightbulb? None, that's a hardware problem.",
                "Why did the programmer quit his job? Because he didn't get arrays.",
                "Why do programmers always get Halloween and Christmas mixed up? Because Oct 31 equals Dec 25.",
                "Debugging: removing the needles from the haystack. Testing: finding the needles.",
                "It works on my machine.",
                "Code today, debug forever."
            ];

            const messages = [
                "Welcome to pragal.fun!",
                "Have fun building things!",
                "Happy coding!",
                "Enjoy the projects!"
            ];

            function bannerText(text) {
                const chars = {
                    'H': ['  #    #  ', ' # #   # ', '#       #', '#       #', '#       #', '  #    # '],
                    'i': ['  #  ', '  #  ', '  #  ', '  #  ', '  #  ', '  #  '],
                    '!': [' # ', ' # ', ' # ', '   ', ' # ', '   ']
                };
                const lines = ['', '', '', '', '', ''];
                for (let char of text.toUpperCase()) {
                    if (char === ' ') {
                        lines = lines.map(l => l + '    ');
                    } else if (chars[char]) {
                        chars[char].forEach((line, i) => {
                            lines[i] += line + ' ';
                        });
                    }
                }
                return lines;
            }

            function animateSl() {
                const trainLine1 = "  _____________________";
                const trainLine2 = " /_____________________\\";
                const trainLine3 = "| () () () () () () () () |";
                const trainLine4 = "|_________________________|";
                const trainLine5 = "  oo oo oo oo oo oo oo oo";

                // Show multiple frames of the train running
                const frames = 8;
                const speeds = [' ', '  ', '   ', '    ', '   ', '  ', ' ', ''];
                
                speeds.forEach((space, idx) => {
                    setTimeout(() => {
                        addOutput(space + trainLine1);
                        addOutput(space + trainLine2);
                        addOutput(space + trainLine3);
                        addOutput(space + trainLine4);
                        addOutput(space + trainLine5);
                        addOutput(""); // spacing
                    }, idx * 150);
                });
                
                setTimeout(() => {
                    addOutput("🚂 CHOO CHOO! All aboard the pragal.fun project express!");
                }, 1500);
            }

            function animateMatrix() {
                const chars = "01アイウエオカキク";
                for (let i = 0; i < 8; i++) {
                    let line = "";
                    for (let j = 0; j < 30; j++) {
                        line += chars[Math.floor(Math.random() * chars.length)];
                    }
                    addOutput(line);
                }
                addOutput("🔢 Welcome to the Matrix...");
            }

            function animateFizzbuzz() {
                addOutput("Playing FizzBuzz (1-20)...");
                let result = "";
                for (let i = 1; i <= 20; i++) {
                    if (i % 15 === 0) result += "FizzBuzz ";
                    else if (i % 3 === 0) result += "Fizz ";
                    else if (i % 5 === 0) result += "Buzz ";
                    else result += i + " ";
                }
                addOutput(result);
            }

            function generateTree(depth = 0, prefix = "") {
                if (depth === 0) {
                    addOutput("pragal.fun/");
                    generateTree(1, "");
                } else if (depth === 1) {
                    addOutput(prefix + "├── games/");
                    addOutput(prefix + "├── tools/");
                    addOutput(prefix + "└── experiments/");
                } else if (depth === 2) {
                    addOutput(prefix + "  ├── word-guess");
                    addOutput(prefix + "  ├── battleship");
                    addOutput(prefix + "  ├── godot-game");
                    addOutput(prefix + "  └── unity-fps");
                }
            }

            function coinFlip() {
                const result = Math.random() > 0.5 ? "Heads 🪙" : "Tails 🪙";
                addOutput(result);
            }

            function rollDice(sides = 6) {
                const result = Math.floor(Math.random() * sides) + 1;
                addOutput(`🎲 You rolled a ${result}!`);
            }

            function animateFire() {
                const fire = ["🔥", "🌡️", "💥", "⚡", "🔥"];
                fire.forEach((f, i) => {
                    setTimeout(() => addOutput(f + " Hot projects incoming!"), i * 200);
                });
            }

            function showAbout() {
                addOutput("╔════════════════════════════════════════╗");
                addOutput("║  pragal.fun v2.0 - Interactive        ║");
                addOutput("║  Built by Pragalbha Patil             ║");
                addOutput("║  A portfolio of games & experiments   ║");
                addOutput("║  Tech: JavaScript, Games, Web         ║");
                addOutput("║  GitHub: Pragalbha-Patil              ║");
                addOutput("╚════════════════════════════════════════╝");
            }

            function drawStar() {
                addOutput("      ★");
                addOutput("     ★ ★");
                addOutput("    ★   ★");
                addOutput("   ★  *  ★");
                addOutput("  ★   ★   ★");
                addOutput("  ★★★★★★★★★");
            }

            function showTime() {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const mins = String(now.getMinutes()).padStart(2, '0');
                const secs = String(now.getSeconds()).padStart(2, '0');
                addOutput(`🕐 ${hours}:${mins}:${secs}`);
            }

            function randomQuote() {
                const quotes = [
                    "\"The only way to do great work is to love what you do.\" - Steve Jobs",
                    "\"Innovation distinguishes between a leader and a follower.\" - Steve Jobs",
                    "\"Life is what happens when you're busy making other plans.\" - John Lennon",
                    "\"The future belongs to those who believe in the beauty of their dreams.\" - Eleanor Roosevelt"
                ];
                addOutput(quotes[Math.floor(Math.random() * quotes.length)]);
            }

            function downloadResume() {
                const resumePath = "assets/resume/resume.pdf";
                const link = document.createElement("a");
                link.href = resumePath;
                link.download = "Pragalbha-Patil-Resume.pdf";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            function render(list) {
                container.innerHTML = "";
                list.forEach(game => {
                    const div = document.createElement("div");
                    div.className = "game";
                    const href = game.domain ? `https://${game.path}` : game.path;
                    let innerHTML = `<a href="${href}" ${game.domain ? 'target="_blank" rel="noopener"' : ''} ${game.down ? 'style="opacity: 0.6; pointer-events: none;"' : ''}>`;
                    innerHTML += game.game
                        ? '<span class="badge badge-game">Game</span>'
                        : '<span class="badge badge-experiment">Tool</span>';
                    innerHTML += ` <span class="name">${game.name}</span>`;
                    const displayUrl = game.domain ? `https://${game.path}` : game.path;
                    innerHTML += ` <span class="meta">${displayUrl}</span>`;
                    if (game.popular) innerHTML += ' <span style="font-size: 0.75rem; color: var(--accent); margin-left: 0.5rem;">★ Popular</span>';
                    if (game.down) innerHTML += ' <span style="font-size: 0.75rem; color: var(--muted); margin-left: 0.5rem;">⚠ Temporarily unavailable</span>';
                    innerHTML += '</a>';
                    div.innerHTML = innerHTML;
                    container.appendChild(div);
                });
            }

            function updateCursor() {
                promptMeasure.textContent = filterInput.value || "";
                const width = promptMeasure.offsetWidth;
                promptWrap.style.setProperty("--cursor-x", `${width}px`);
            }

            function addOutput(text, isCommand = false) {
                const line = document.createElement("div");
                line.className = isCommand ? "output-line output-command" : "output-line";
                line.textContent = text;
                outputDiv.appendChild(line);
                outputDiv.scrollTop = outputDiv.scrollHeight;
            }

            function handleCommand(cmd) {
                const parts = cmd.trim().split(/\s+/);
                const command = parts[0].toLowerCase();
                const args = parts.slice(1);

                if (cmd.trim()) addOutput(`pragalbha@web:~$ ${cmd}`);

                switch(command) {
                    case "ls":
                    case "ls -la":
                        games.forEach(g => {
                            addOutput(`  ${g.game ? "[G]" : "[T]"} ${g.name}`);
                        });
                        break;
                    case "sl":
                        animateSl();
                        break;
                    case "matrix":
                        animateMatrix();
                        break;
                    case "fortune":
                        const fortune = fortunes[Math.floor(Math.random() * fortunes.length)];
                        addOutput(`💡 ${fortune}`);
                        break;
                    case "date":
                        addOutput(new Date().toString());
                        break;
                    case "fizzbuzz":
                        animateFizzbuzz();
                        break;
                    case "whoami":
                        addOutput("pragalbha");
                        break;
                    case "neofetch":
                        addOutput("╔═════════════════════════════════════╗");
                        addOutput("║  pragal.fun v1.0 (Web Terminal)     ║");
                        addOutput("║  Platform: Browser                  ║");
                        addOutput("║  Theme: iTerm Green                 ║");
                        addOutput("║  Mood: Creative & Fun               ║");
                        addOutput("╚═════════════════════════════════════╝");
                        break;
                    case "xcow":
                        const msg = args.length > 0 ? args.join(" ") : messages[Math.floor(Math.random() * messages.length)];
                        addOutput(` ${"-".repeat(msg.length + 2)}`);
                        addOutput(`| ${msg} |`);
                        addOutput(` ${"-".repeat(msg.length + 2)}`);
                        addOutput(cowArt);
                        break;
                    case "tree":
                        generateTree();
                        break;
                    case "flip":
                        coinFlip();
                        break;
                    case "roll":
                        const sides = args.length > 0 ? parseInt(args[0]) || 6 : 6;
                        rollDice(sides);
                        break;
                    case "fire":
                        animateFire();
                        break;
                    case "star":
                        drawStar();
                        break;
                    case "time":
                        showTime();
                        break;
                    case "quote":
                        randomQuote();
                        break;
                    case "about":
                        showAbout();
                        break;
                    case "hire":
                        addOutput("🔗 Opening LinkedIn profile...");
                        addOutput("📥 Downloading resume...");
                        window.open("https://www.linkedin.com/in/pragalbha-patil-610541172/", "_blank");
                        downloadResume();
                        break;
                    case "help":
                        addOutput("Available commands:");
                        addOutput("  ls           - List all projects");
                        addOutput("  clear        - Clear screen");
                        addOutput("  pwd          - Print working directory");
                        addOutput("  echo [text]  - Echo text");
                        addOutput("  date         - Show current date/time");
                        addOutput("  whoami       - Show current user");
                        addOutput("  fortune      - Random tech fortune");
                        addOutput("  quote        - Random inspirational quote");
                        addOutput("  sl           - Animated train!");
                        addOutput("  matrix       - Matrix effect");
                        addOutput("  fizzbuzz     - FizzBuzz game");
                        addOutput("  tree         - Project structure");
                        addOutput("  flip         - Coin flip");
                        addOutput("  roll [sides] - Roll dice (default 6)");
                        addOutput("  fire         - Fire animation");
                        addOutput("  star         - Draw a star");
                        addOutput("  time         - Show current time");
                        addOutput("  about        - About pragal.fun");
                        addOutput("  neofetch     - System info");
                        addOutput("  xcow [text]  - Wise cow says...");
                        addOutput("  hire         - Hire this guy ASAP!!!");
                        break;
                    case "clear":
                        outputDiv.innerHTML = "";
                        return true;
                    case "pwd":
                        addOutput("/home/pragalbha/projects");
                        break;
                    case "echo":
                        if (args.length > 0) {
                            addOutput(args.join(" "));
                        }
                        break;
                    default:
                        if (cmd.trim()) {
                            addOutput(`command not found: ${command}. Type 'help' for available commands.`);
                        }
                }
                return false;
            }

            filterInput.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    const cmd = filterInput.value;
                    handleCommand(cmd);
                    filterInput.value = "";
                    updateCursor();
                }
            });

            filterInput.addEventListener("input", e => {
                updateCursor();
            });

            updateCursor();
            render(games);
            addOutput("Welcome to pragal.fun terminal. Type 'help' for commands.");
        </script>

<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <title>Pragalbha's page</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
            :root {
                --bg: #0e0f13;
                --bg-soft: #151720;
                --card: #1b1e2b;
                --text: #e8e9f0;
                --muted: #a0a3bd;
                /* retain pragal.fun accent colors */
                --accent: #7c8cff;
                --accent-soft: rgba(124, 140, 255, 0.15);
            }

            body {
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                margin: 0;
                background: var(--bg);
                color: var(--text);
            }

            header {
                padding: 2.5rem 1rem 1.5rem;
                text-align: center;
            }

            header h1 {
                margin: 0;
                font-size: 2.4rem;
                font-weight: 700;
                letter-spacing: -0.02em;
            }

            header p {
                margin-top: 0.5rem;
                color: var(--muted);
            }

            .controls {
                max-width: 900px;
                margin: 0 auto 1.5rem;
                padding: 0 1rem;
                display: flex;
                justify-content: center;
            }

            .controls input {
                width: 100%;
                max-width: 420px;
                padding: 0.65rem 0.8rem;
                font-size: 1rem;
                border-radius: 10px;
                border: 1px solid #2a2d40;
                background: var(--bg-soft);
                color: var(--text);
                outline: none;
            }

            .controls input::placeholder {
                color: var(--muted);
            }

            .controls input:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 3px var(--accent-soft);
            }

            .games {
                max-width: 900px;
                margin: 0 auto 3rem;
                padding: 0 1rem;
                column-count: 2;
                column-gap: 1rem;
            }

            .title {
                font-weight: 600;
                color: var(--accent);
            }

            @media (max-width: 700px) {
                .games {
                    column-count: 1;
                }
            }

            .game {
                break-inside: avoid;
                margin-bottom: 0.75rem;
            }

            .game a {
                display: block;
                padding: 0.85rem 1rem;
                background: var(--card);
                border-radius: 14px;
                text-decoration: none;
                color: var(--text);
                border: 1px solid #242842;
                transition: transform 0.1s ease, box-shadow 0.1s ease, border-color 0.1s ease;
            }

            .game a:hover {
                transform: translateY(-1px);
                border-color: var(--accent);
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
            }

            .game span {
                font-size: 1.05rem;
                font-weight: 500;
            }

            footer {
                text-align: center;
                font-size: 0.85rem;
                color: var(--muted);
                padding-bottom: 2rem;
            }

            .about {
                max-width: 900px;
                margin: 0 auto 2rem;
                padding: 0 1rem;
                text-align: center;
            }

            .about-inner {
                background: var(--bg-soft);
                border: 1px solid #242842;
                border-radius: 16px;
                padding: 1rem 1.25rem;
                color: var(--muted);
            }

            .about-inner strong {
                color: var(--text);
                font-weight: 600;
            }

            .links {
                margin-top: 0.6rem;
                display: flex;
                justify-content: center;
                gap: 1rem;
            }

            .links a {
                text-decoration: none;
                font-size: 0.9rem;
                color: var(--accent);
            }

            .links a:hover {
                text-decoration: underline;
            }
        </style>
    </head>

    <body>

        <header>
            <h1 class="title">pragal.fun</h1>
            <p>Small browser games & experiments</p>
        </header>

        <section class="about">
            <div class="about-inner">
                <p>
                    Built by <strong>Pragalbha Patil</strong> — engineer who enjoys building
                    small web games, experiments, and playful internet projects.
                </p>
                <div class="links">
                    <a href="https://github.com/Pragalbha-Patil" target="_blank" rel="noopener">GitHub</a>
                    <a href="https://www.linkedin.com/in/pragalbha-patil-610541172/" target="_blank" rel="noopener">LinkedIn</a>
                </div>
            </div>
        </section>

        <div class="controls">
            <input id="filter" type="text" placeholder="Filter games…" />
        </div>

        <div class="games" id="games"></div>

        <footer>
            &copy; Pragalbha Patil. All rights reserved.
         <script>
            document.querySelector('footer').innerHTML = document.querySelector('footer').innerHTML.replace('Pragalbha', new Date().getFullYear() + ' Pragalbha');
        </script>
        </footer>

        <script>
            const games = [
                { name: "Word game", path: "word.pragal.fun", domain: true, popular: true },
                { name: "Battleship", path: "playbattleship.online", domain: true, popular: true, down: true },
                { name: "Chess", path: "chess/" },
                { name: "Snake Game", path: "snakegame/" },
                { name: "FPS Game", path: "fps/", popular: true },
                { name: "Cannibals & Missionaries", path: "cannibals-missioneries/" },
                { name: "Monkey Lander", path: "monkey-lander/" },
                { name: "One Million Checkboxes", path: "one-million-checkboxes/" },
                { name: "PSP Game", path: "pspgame/" },
                { name: "T2B", path: "t2b/" },
                { name: "Quotes", path: "quotes/" }
            ];

            const container = document.getElementById("games");
            const filterInput = document.getElementById("filter");

            function render(list) {
                container.innerHTML = "";
                list.forEach(game => {
                    const div = document.createElement("div");
                    div.className = "game";
                    const href = game.domain ? `https://${game.path}` : game.path;
                    let innerHTML = `<a href="${href}" ${game.domain ? 'target="_blank" rel="noopener"' : ''} ${game.down ? 'style="opacity: 0.6; pointer-events: none;"' : ''}><span>${game.name}</span>`;
                    if (game.popular) innerHTML += ' <span style="font-size: 0.75rem; color: var(--accent); margin-left: 0.5rem;">★ Popular</span>';
                    if (game.down) innerHTML += ' <span style="font-size: 0.75rem; color: var(--muted); margin-left: 0.5rem;">⚠ Temporarily unavailable</span>';
                    innerHTML += '</a>';
                    div.innerHTML = innerHTML;
                    container.appendChild(div);
                });
            }

            filterInput.addEventListener("input", e => {
                const q = e.target.value.toLowerCase();
                render(games.filter(g => g.name.toLowerCase().includes(q)));
            });

            render(games);
        </script>

    </body>

</html>

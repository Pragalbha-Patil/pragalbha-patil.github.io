<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>pragal.fun | Games by Pragalbha Patil</title>
        <style>
            :root {
                --bg: #050711;
                --text: #f5f7ff;
                --muted: #a5b0cf;
                --accent: #7dd3fc;
                --accent-2: #f59e0b;
                --card: rgba(13, 18, 33, 0.82);
                --card-border: rgba(148, 163, 184, 0.16);
                --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
            }

            * {
                box-sizing: border-box;
            }

            html {
                scroll-behavior: smooth;
            }

            body {
                margin: 0;
                min-height: 100vh;
                font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
                color: var(--text);
                background:
                    radial-gradient(900px 520px at 12% 0%, rgba(56, 189, 248, 0.18), transparent 60%),
                    radial-gradient(800px 520px at 88% 12%, rgba(245, 158, 11, 0.18), transparent 56%),
                    linear-gradient(180deg, #050711 0%, #090d18 46%, #050711 100%);
            }

            body::before,
            body::after {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
            }

            body::before {
                background-image:
                    linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
                background-size: 56px 56px;
                mask-image: radial-gradient(circle at 50% 0%, rgba(0, 0, 0, 0.9), transparent 70%);
                opacity: 0.28;
            }

            body::after {
                background:
                    radial-gradient(circle at 20% 20%, rgba(125, 211, 252, 0.12), transparent 24%),
                    radial-gradient(circle at 80% 18%, rgba(245, 158, 11, 0.12), transparent 22%),
                    radial-gradient(circle at 50% 85%, rgba(99, 102, 241, 0.08), transparent 28%);
                opacity: 0.8;
            }

            a {
                color: inherit;
            }

            .page {
                width: min(1180px, calc(100% - 2rem));
                margin: 0 auto;
                padding: 2rem 0 3.5rem;
                position: relative;
                z-index: 1;
            }

            .hero {
                position: relative;
                display: grid;
                gap: 1.5rem;
                padding: 2rem;
                border: 1px solid var(--card-border);
                border-radius: 28px;
                background:
                    linear-gradient(180deg, rgba(14, 19, 35, 0.92), rgba(8, 12, 23, 0.88)),
                    radial-gradient(circle at top right, rgba(125, 211, 252, 0.14), transparent 35%);
                box-shadow: var(--shadow);
                backdrop-filter: blur(18px);
                overflow: hidden;
            }

            .hero::after {
                content: "";
                position: absolute;
                right: -120px;
                top: -120px;
                width: 280px;
                height: 280px;
                border-radius: 50%;
                background: radial-gradient(circle, rgba(125, 211, 252, 0.2), transparent 68%);
                pointer-events: none;
            }

            .topbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                color: var(--muted);
                font-size: 0.92rem;
                position: relative;
                z-index: 1;
            }

            .brand {
                color: var(--text);
                font-weight: 700;
                letter-spacing: 0.02em;
            }

            .hero-grid {
                display: grid;
                grid-template-columns: minmax(0, 1.5fr) minmax(280px, 0.9fr);
                gap: 1.5rem;
                position: relative;
                z-index: 1;
            }

            .eyebrow {
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                padding: 0.4rem 0.75rem;
                border-radius: 999px;
                background: rgba(125, 211, 252, 0.12);
                color: #c7eaff;
                border: 1px solid rgba(125, 211, 252, 0.18);
                font-size: 0.8rem;
                font-weight: 600;
                letter-spacing: 0.06em;
                text-transform: uppercase;
            }

            .hero h1 {
                margin: 0.95rem 0 0;
                font-size: clamp(2.8rem, 7vw, 5.6rem);
                line-height: 0.95;
                letter-spacing: -0.05em;
            }

            .hero p {
                margin: 1rem 0 0;
                max-width: 60ch;
                color: var(--muted);
                font-size: 1.05rem;
                line-height: 1.7;
            }

            .hero-actions {
                display: flex;
                flex-wrap: wrap;
                gap: 0.8rem;
                margin-top: 1.4rem;
            }

            .button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
                padding: 0.85rem 1.1rem;
                border-radius: 999px;
                text-decoration: none;
                font-weight: 700;
                transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            }

            .button-primary {
                color: #06111d;
                background: linear-gradient(135deg, #a5f3fc, #7dd3fc 55%, #f8fafc);
                box-shadow: 0 16px 34px rgba(125, 211, 252, 0.22);
            }

            .button-secondary {
                color: var(--text);
                background: rgba(255, 255, 255, 0.04);
                border: 1px solid rgba(148, 163, 184, 0.18);
            }

            .button:hover {
                transform: translateY(-2px);
                box-shadow: 0 18px 34px rgba(0, 0, 0, 0.22);
            }

            .hero-panel {
                position: relative;
                border-radius: 24px;
                border: 1px solid rgba(148, 163, 184, 0.14);
                background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02));
                padding: 1.2rem;
                display: grid;
                gap: 1rem;
            }

            .hero-panel h2 {
                margin: 0;
                font-size: 1rem;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.14em;
            }

            .stats {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 0.8rem;
            }

            .stat {
                padding: 0.95rem;
                border-radius: 18px;
                background: rgba(7, 11, 21, 0.54);
                border: 1px solid rgba(148, 163, 184, 0.12);
            }

            .stat strong {
                display: block;
                font-size: 1.45rem;
                margin-bottom: 0.2rem;
            }

            .stat span {
                color: var(--muted);
                font-size: 0.9rem;
            }

            .section {
                margin-top: 1.5rem;
            }

            .section-header {
                display: flex;
                align-items: end;
                justify-content: space-between;
                gap: 1rem;
                margin: 0 0 1rem;
            }

            .section-header h2 {
                margin: 0;
                font-size: 1.2rem;
                letter-spacing: -0.02em;
            }

            .section-header p {
                margin: 0;
                color: var(--muted);
                max-width: 42ch;
                font-size: 0.95rem;
                line-height: 1.5;
            }

            .games {
                display: grid;
                grid-template-columns: repeat(12, minmax(0, 1fr));
                gap: 1rem;
            }

            .game-card {
                grid-column: span 4;
                display: flex;
                flex-direction: column;
                gap: 1rem;
                min-height: 220px;
                padding: 1.2rem;
                border-radius: 24px;
                background: var(--card);
                border: 1px solid var(--card-border);
                box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
                text-decoration: none;
                color: inherit;
                transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
                overflow: hidden;
            }

            .game-card::before {
                content: "";
                height: 4px;
                width: 100%;
                border-radius: 999px;
                background: linear-gradient(90deg, rgba(125, 211, 252, 0.95), rgba(245, 158, 11, 0.95));
            }

            .game-card:hover {
                transform: translateY(-4px);
                border-color: rgba(125, 211, 252, 0.45);
                box-shadow: 0 26px 50px rgba(0, 0, 0, 0.3);
            }

            .game-meta {
                display: flex;
                flex-wrap: wrap;
                gap: 0.45rem;
            }

            .pill {
                display: flex;
                align-items: center;
                gap: 0.4rem;
                padding: 0.35rem 0.7rem;
                border-radius: 999px;
                border: 1px solid rgba(148, 163, 184, 0.16);
                background: rgba(255, 255, 255, 0.04);
                font-size: 0.74rem;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.08em;
                font-weight: 700;
            }

            .pill-featured {
                color: #c7eaff;
                border-color: rgba(125, 211, 252, 0.2);
                background: rgba(125, 211, 252, 0.12);
            }

            .pill-external {
                color: #fde68a;
                border-color: rgba(245, 158, 11, 0.2);
                background: rgba(245, 158, 11, 0.12);
            }

            .game-card h3 {
                margin: 0;
                font-size: 1.2rem;
                letter-spacing: -0.02em;
            }

            .game-card p {
                margin: 0;
                color: var(--muted);
                line-height: 1.65;
                font-size: 0.96rem;
            }

            .card-footer {
                margin-top: auto;
                display: flex;
                justify-content: space-between;
                gap: 0.75rem;
                align-items: center;
                color: var(--muted);
                font-size: 0.9rem;
            }

            .card-action {
                color: var(--text);
                font-weight: 700;
            }

            footer {
                margin-top: 1.75rem;
                text-align: center;
                font-size: 0.88rem;
                color: var(--muted);
                padding-bottom: 0.25rem;
            }

            @media (max-width: 960px) {
                .hero-grid {
                    grid-template-columns: 1fr;
                }

                .game-card {
                    grid-column: span 6;
                }
            }

            @media (max-width: 720px) {
                .page {
                    width: min(100%, calc(100% - 1rem));
                    padding-top: 0.5rem;
                }

                .hero,
                .hero-panel {
                    border-radius: 22px;
                }

                .hero {
                    padding: 1.25rem;
                }

                .stats {
                    grid-template-columns: 1fr;
                }

                .games {
                    grid-template-columns: 1fr;
                }

                .game-card {
                    grid-column: auto;
                }

                .section-header {
                    align-items: start;
                    flex-direction: column;
                }
            }
        </style>
    </head>
    <body>
        <main class="page">
            <section class="hero" aria-labelledby="hero-title">
                <div class="topbar">
                    <a class="brand" href="/">Pragal.fun</a>
                    <a href="https://pragalbhapatil.com" target="_blank" rel="noopener">pragalbhapatil.com - for nerdy stuff</a>
                </div>
            </section>

            <section class="section" id="games" aria-labelledby="games-title">
                <div class="section-header">
                    <div>
                        <h2 id="games-title">Games and experiments</h2>
                    </div>
                </div>

                <div class="games" id="games-grid"></div>
            </section>

            <footer>
                © <span id="year"></span> Pragalbha Patil.
            </footer>
        </main>

        <script>
            const games = [
                {
                    name: "Orbit",
                    description: "A polished browser game built for quick play sessions.",
                    href: "https://orbit.pragal.fun",
                    type: "Featured game",
                    featured: true,
                    external: true,
                },
                {
                    name: "2D Monster Squasher",
                    description: "A fast-action Godot game hosted on itch.io.",
                    href: "https://ikistuacha.itch.io/psp-first-godot-game",
                    type: "Featured game",
                    featured: true,
                    external: true,
                },
                {
                    name: "One Million Checkboxes",
                    description: "A playful large-scale interaction experiment with a game-like loop.",
                    href: "/one-million-checkboxes/",
                    type: "Featured experiment",
                    featured: true,
                    external: false,
                },
                {
                    name: "PSP Game",
                    description: "Another playable Unity project in the collection.",
                    href: "/pspgame/",
                    type: "Game",
                    external: false,
                },
            ];

            const gamesGrid = document.getElementById("games-grid");
            const year = document.getElementById("year");

            function createCard(game) {
                const card = document.createElement("a");
                card.className = "game-card";
                card.href = game.href;
                if (game.external) {
                    card.target = "_blank";
                    card.rel = "noopener";
                }

                const meta = document.createElement("div");
                meta.className = "game-meta";

                const typePill = document.createElement("span");
                typePill.className = "pill";
                typePill.textContent = game.type;
                meta.appendChild(typePill);

                if (game.featured) {
                    const featuredPill = document.createElement("span");
                    featuredPill.className = "pill pill-featured";
                    featuredPill.textContent = "Featured";
                    meta.appendChild(featuredPill);
                }

                if (game.external) {
                    const externalPill = document.createElement("span");
                    externalPill.className = "pill pill-external";
                    externalPill.textContent = "External";
                    meta.appendChild(externalPill);
                }

                const title = document.createElement("h3");
                title.textContent = game.name;

                const description = document.createElement("p");
                description.textContent = game.description;

                const footer = document.createElement("div");
                footer.className = "card-footer";

                const linkText = document.createElement("span");
                linkText.textContent = game.external ? game.href.replace(/^https?:\/\//, "") : game.href;

                const action = document.createElement("span");
                action.className = "card-action";
                action.textContent = "Open project →";

                footer.append(linkText, action);
                card.append(meta, title, description, footer);
                return card;
            }

            games.forEach(game => gamesGrid.appendChild(createCard(game)));
            year.textContent = new Date().getFullYear();
        </script>
    </body>
</html>
